name: Convert custom MRS

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'mrs-sources.json'
      - 'mrs_converter/**'
      - '.github/workflows/custom-mrs.yml'
  pull_request:
    paths:
      - 'mrs-sources.json'
      - 'mrs_converter/**'
      - '.github/workflows/custom-mrs.yml'

permissions:
  contents: read

concurrency:
  group: custom-mrs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install converter dependency
        run: python -m pip install -r requirements.txt
      - name: Check update interval
        id: interval
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == 'schedule' ]]; then
            due="$(python mrs_converter/convert.py --check-due)"
            echo "due=$due" >> "$GITHUB_OUTPUT"
          else
            echo 'due=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Test MRS converter
        if: steps.interval.outputs.due == 'true'
        run: python -m unittest discover -s mrs_converter/tests -v
      - name: Validate source configuration
        if: steps.interval.outputs.due == 'true'
        run: python -c 'from pathlib import Path; from mrs_converter.convert import load_sources; load_sources(Path("mrs-sources.json"))'
      - name: Download verified Mihomo compiler
        if: steps.interval.outputs.due == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p .deps
          curl --fail --silent --show-error --location --retry 3 \
            --output .deps/mihomo.gz \
            'https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1-v1.19.34.gz'
          echo '0c07340a01408d033dda4088ea2a4c1e4d82aeed7b2f84f7c046e93b6ff3290c  .deps/mihomo.gz' | sha256sum --check
          gzip -dc .deps/mihomo.gz > .deps/mihomo
          chmod +x .deps/mihomo
          .deps/mihomo -v
      - name: Convert upstream rules to MRS
        if: steps.interval.outputs.due == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python mrs_converter/convert.py --mihomo .deps/mihomo
      - name: Commit MRS files
        if: steps.interval.outputs.due == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mrs/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update custom MRS rule sets'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
